<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Albi TT — Carte des rencontres</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e12; --panel:#15171d; --panel2:#1c1f27; --line:#2a2d37;
  --text:#f5f1e6; --muted:#9d9a8c; --accent:#ff6a1a; --live:#ff3b3b; --win:#3ecf8e; --lose:#8a8d98;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto auto 1fr;height:100dvh}
.topbar{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font:700 24px "Saira Condensed",sans-serif;letter-spacing:.02em;text-transform:uppercase}
.topbar h1 b{color:var(--accent)}
.topbar .sub{color:var(--muted);font-size:13px}
.embed .topbar{display:none}
.live-banner{grid-column:1/-1;display:none;background:var(--live);color:#fff;padding:7px 16px;font-weight:600;font-size:14px}
.live-banner.on{display:block}
.live-banner i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:8px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
#map{grid-column:1;grid-row:3;min-height:0;background:#0b0c10}
.side{grid-column:2;grid-row:3;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:7px 6px;border-radius:7px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:5px 11px;border-radius:99px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.list{flex:1;overflow:auto;padding:4px 12px 14px}
.day{margin:16px 2px 6px;font:600 15px "Saira Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.card:hover,.card.sel{border-color:var(--accent)}
.card .when{font:700 20px "Saira Condensed",sans-serif;color:var(--text)}
.card .when small{display:block;font:400 11px sans-serif;color:var(--muted)}
.teams b{color:var(--accent)}
.teams span.vs{color:var(--muted);font-size:12px;margin:0 4px}
.where{color:var(--muted);font-size:13px}
.where.warn{color:#e8b04a}
.res{text-align:right;min-width:62px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--live);border-color:var(--live);color:#fff}
.score{font:700 24px "Saira Condensed",sans-serif;white-space:nowrap}
.score.win{color:var(--win)} .score.lose{color:var(--lose)} .score.live{color:var(--live)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.status{padding:7px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.status.err{color:#e8b04a}
/* repères carte */
.pin{position:relative;width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;font:700 12px sans-serif}
.pin.done{background:#6b6f7b}
.pin.live{background:var(--live)}
.pin.live::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--live);animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;min-width:230px;max-width:280px;font-size:14px}
.pop h4{margin:0 0 2px;font:700 18px "Saira Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em}
.pop .addr{color:var(--muted);font-size:12.5px;margin-bottom:8px;white-space:pre-line}
.pop .m{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pop .m small{color:var(--muted);display:block}
.pop .anec{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:#d9d5c6}
.pop .anec small{display:block;margin-top:4px;color:var(--muted)}
.pop .anec a,.pop .go{color:var(--accent)}
.pop .go{display:inline-block;margin-top:8px;font-weight:600;text-decoration:none}
.pop .approx{color:#e8b04a;font-size:12px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 44% 1fr}
  #map{grid-column:1;grid-row:3}
  .side{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--line)}
  .topbar .sub{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><h1>Albi <b>TT</b> · Où jouent nos équipes ?</h1><span class="sub">Rencontres par équipes, en direct</span></header>
  <div class="live-banner" id="live"></div>
  <div id="map" aria-label="Carte des rencontres"></div>
  <aside class="side">
    <div class="filters">
      <div class="seg" id="period">
        <button data-p="todo" class="on">Prochaines</button>
        <button data-p="done">Résultats</button>
        <button data-p="all">Tout</button>
      </div>
      <div class="chips" id="teams"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="status" id="status"><span>Chargement…</span></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== Réglages ===== */
const CONFIG = {
  SHEET_ID: '1kz2up9DvQNyhJpwaqQzMKHEl1qwB2UMKX0xzc19oqJg',
  SHEET_TAB: 'Rencontres',       // nom exact de l'onglet des rencontres
  SALLES_TAB: 'Salles',          // onglet des salles (colonnes : salle, adresse, ville, anecdote)
  WIKI_FALLBACK: true,           // false = pas d'anecdote Wikipédia quand la colonne est vide
  REFRESH_MS: 30000,             // actualisation du tableur
  HOME: { lat: 43.9298, lng: 2.1480 },   // Albi, pour les distances
  TILES: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  ATTRIB: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
};

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');

function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && t[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function parseDate(d, h){
  const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(d || '');
  if (!m) return { date: null, hasTime: false };
  const t = /(\d{1,2})\s*[h:]\s*(\d{0,2})/i.exec(h || '');
  const date = new Date(+m[3], +m[2]-1, +m[1], t ? +t[1] : 0, t ? (+t[2] || 0) : 0);
  return { date, hasTime: !!t };
}

const COORD_RE = /^\s*(-?\d{1,3}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
const km = (a, b) => {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const fmtDay = d => new Intl.DateTimeFormat('fr-FR', { weekday:'long', day:'numeric', month:'long' }).format(d);
const fmtTime = (d, has) => has ? `${d.getHours()}h${String(d.getMinutes()).padStart(2,'0') === '00' ? '' : String(d.getMinutes()).padStart(2,'0')}` : '';

/* ===== État ===== */
const state = { matches: [], period: 'todo', teams: new Set(), sel: null, userMoved: false, needFit: true };
const locs = new Map();                 // clé de lieu -> {lat,lng,city,approx,failed,anecdote,...}
const geoCache = store.get('att_geo_v1');
const wikiCache = store.get('att_wiki_v1');

/* ===== Tableur ===== */
async function fetchTab(tab){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv`
    + (tab ? `&sheet=${encodeURIComponent(tab)}` : '') + `&_=${Date.now()}`;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = parseCSV(await r.text());
  const head = rows.shift().map(norm);
  return {
    head,
    rows: rows.filter(r => r.some(c => c.trim() !== ''))
      .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])))
  };
}

// Onglet « Salles » (facultatif) : une ligne par salle ou par ville. Clé = salle, sinon ville.
// Si l'onglet n'existe pas, Google renvoie l'onglet par défaut : on le reconnaît à l'absence de colonne « anecdote ».
let salles = new Map();
async function loadSalles(){
  try {
    const { head, rows } = await fetchTab(CONFIG.SALLES_TAB);
    salles = new Map();
    if (!head.includes('anecdote') || head.includes('numero_equipe')) return;
    for (const o of rows) for (const k of [o.salle, o.ville]) if (k) salles.set(norm(k), o);
  } catch { /* on garde la version précédente */ }
}

async function loadSheet(){
  await loadSalles();
  const { rows } = await fetchTab(CONFIG.SHEET_TAB);
  return rows.map(toMatch).filter(m => m.team || m.opponent);
}

function toMatch(o, idx){
  const { date, hasTime } = parseDate(o.date, o.heure);
  const st = norm(o.statut).replace(/\s+/g, '');
  const status = /^(encours|direct|live)/.test(st) ? 'live' : /^(termin|clo|fini|fin$)/.test(st) ? 'done' : 'todo';
  const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
  const ville = o.ville_rencontre || '';
  const S = salles.get(norm(o.salle)) || salles.get(norm(ville));      // ligne de l'onglet Salles
  const num1 = v => { const n = Number(String(v ?? '').replace(',', '.')); return (String(v ?? '').trim() === '' || isNaN(n)) ? null : n; };
  const addrText = S?.adresse || o.adresse || o.coordonnees || '';
  // priorité : lat/lng de l'onglet Salles > coordonnées saisies (« lat, lng ») > adresse à géocoder > ville
  let pt = (num1(S?.lat) != null && num1(S?.lng) != null) ? { lat: num1(S.lat), lng: num1(S.lng) } : null;
  if (!pt){
    const cm = COORD_RE.exec(o.coordonnees || '') || COORD_RE.exec(addrText);
    if (cm) pt = { lat: +cm[1], lng: +cm[2] };
  }
  let key, loc;
  if (pt){ key = `${pt.lat.toFixed(5)},${pt.lng.toFixed(5)}`; loc = { ...pt, city: ville }; }
  else {
    const text = addrText || ville;
    key = 'a:' + norm(text).replace(/\s+/g, ' ');
    loc = { text, ville, approx: !addrText };
  }
  if (!locs.has(key)) locs.set(key, { key, ...loc, ...(geoCache[key] || {}) });
  const L = locs.get(key);
  L.name = S?.salle || o.salle || L.name;
  L.addr = COORD_RE.test(addrText) ? '' : addrText;      // inutile d'afficher des coordonnées comme adresse
  const anec = o.anecdote || S?.anecdote;
  if (anec) L.anecdote = { text: anec, own: true };
  else if (L.anecdote?.own) L.anecdote = undefined;   // anecdote supprimée du tableur
  return {
    id: idx, team: o.numero_equipe, opponent: o.adversaire, ville, status, date, hasTime,
    sA: num(o.score_equipe_albi), sB: num(o.score_equipe_adverse), key
  };
}

/* ===== Géocodage (une seule fois par adresse, mis en cache) ===== */
async function nominatim(q){
  const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&countrycodes=fr&accept-language=fr&q=' + encodeURIComponent(q);
  const r = await fetch(u);
  if (!r.ok) throw new Error('nominatim ' + r.status);
  const j = await r.json();
  if (!j[0]) return null;
  const a = j[0].address || {};
  return { lat: +j[0].lat, lng: +j[0].lon, city: a.city || a.town || a.village || a.municipality || '' };
}
async function geocode(loc){
  const lines = (loc.text || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
  const strip = s => s.replace(/^\d+(?:\s*[-–]\s*\d+)?\s*(?:bis|ter)?\s+/i, '');
  const variants = [...new Set([
    lines.join(', '),
    lines.length > 1 ? lines.slice(1).join(', ') : null,
    lines.map(strip).join(', ')
  ].filter(Boolean))];
  try {
    for (const q of variants){ const r = await nominatim(q); if (r) return r; await sleep(1100); }
    if (loc.ville){ const r = await nominatim(loc.ville + ', France'); if (r) return { ...r, approx: true }; }
  } catch { return null; }
  return null;
}
let resolving = false;
async function resolvePending(){
  if (resolving) return; resolving = true;
  for (const loc of locs.values()){
    if (loc.lat != null || loc.failed) continue;
    const r = await geocode(loc);
    if (r){ Object.assign(loc, r); geoCache[loc.key] = r; store.set('att_geo_v1', geoCache); }
    else loc.failed = true;
    render();
    await sleep(1100);
  }
  resolving = false;
  if (!state.userMoved) fit();
}

/* ===== Anecdote : introduction Wikipédia de la commune (si rien dans le tableur) ===== */
async function ensureAnecdote(loc){
  if (loc.anecdote !== undefined) return;
  loc.anecdote = null;
  if (!CONFIG.WIKI_FALLBACK) return;
  const title = (loc.city || loc.ville || '').trim();
  if (!title) return;
  if (wikiCache[title] !== undefined){ loc.anecdote = wikiCache[title]; return; }
  try {
    const r = await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
    if (r.ok){
      const j = await r.json();
      if (j.type === 'standard' && j.extract){
        let t = j.extract.split(/(?<=[.!?])\s+/).slice(0, 2).join(' ');
        if (t.length > 240) t = t.slice(0, 237).trim() + '…';
        loc.anecdote = { text: t, url: j.content_urls?.desktop?.page, wiki: true };
      }
    }
  } catch {}
  wikiCache[title] = loc.anecdote; store.set('att_wiki_v1', wikiCache);
}

/* ===== Carte ===== */
const map = L.map('map', { zoomControl: true }).setView([CONFIG.HOME.lat, CONFIG.HOME.lng], 9);
L.tileLayer(CONFIG.TILES, { attribution: CONFIG.ATTRIB, maxZoom: 19 }).addTo(map);
map.on('dragstart', () => state.userMoved = true);
map.getContainer().addEventListener('wheel', () => state.userMoved = true, { passive: true });
const markers = new Map();

function fit(){
  const pts = [...markers.values()].map(m => m.getLatLng());
  if (!pts.length) return;
  if (pts.length === 1) map.setView(pts[0], 12);
  else map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 11 });
}

const pinIcon = (cls, n) => L.divIcon({ className: '', html: `<div class="pin ${cls}">${n > 1 ? n : ''}</div>`, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14] });

function popupHtml(loc){
  const ms = loc.ms || [];
  const dist = km(CONFIG.HOME, loc);
  const items = ms.map(m => {
    const when = m.date ? `${fmtDay(m.date)}${m.hasTime ? ', ' + fmtTime(m.date, true) : ''}` : 'Date à confirmer';
    return `<div class="m"><div><b>${esc(m.team)}</b> vs ${esc(m.opponent)}<small>${esc(when)}</small></div><div>${resultHtml(m)}</div></div>`;
  }).join('');
  const a = loc.anecdote;
  const anec = a ? `<div class="anec">${esc(a.text)}${a.wiki ? `<small>À propos de ${esc(loc.city || loc.ville)} · <a href="${esc(a.url)}" target="_blank" rel="noopener">Wikipédia</a></small>` : ''}</div>` : '';
  return `<div class="pop"><h4>${esc(loc.name || loc.city || loc.ville || 'Lieu')}</h4>
    <div class="addr">${esc(loc.addr || '')}${dist >= 5 ? `${loc.addr ? '\n' : ''}≈ ${Math.round(dist)} km d’Albi (à vol d’oiseau)` : ''}</div>
    ${loc.approx ? '<div class="approx">Position approximative (adresse non précisée)</div>' : ''}
    ${items}${anec}
    <a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}">Itinéraire →</a></div>`;
}

function resultHtml(m){
  if (m.status === 'todo' || m.sA == null || m.sB == null) return `<span class="pill">${m.status === 'live' ? 'En direct' : 'À venir'}</span>`;
  const cls = m.status === 'live' ? 'live' : (m.sA > m.sB ? 'win' : m.sA < m.sB ? 'lose' : '');
  return `${m.status === 'live' ? '<span class="pill live">En direct</span><br>' : ''}<span class="score ${cls}">${m.sA} – ${m.sB}</span>`;
}

function focusLoc(key){
  const loc = locs.get(key), mk = markers.get(key);
  state.sel = key; state.userMoved = true;
  if (!loc || !mk) return render();
  map.flyTo([loc.lat, loc.lng], Math.max(map.getZoom(), 13), { duration: .6 });
  setTimeout(() => mk.openPopup(), 700);   // après le vol, sinon le recadrage automatique de la fiche est ignoré
  render();
}

/* ===== Rendu ===== */
function visible(m){
  if (state.teams.size && !state.teams.has(m.team)) return false;
  if (state.period === 'todo') return m.status !== 'done';
  if (state.period === 'done') return m.status === 'done';
  return true;
}

function render(){
  // pastilles d'équipes
  const teams = [...new Set(state.matches.map(m => m.team))].sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  $('#teams').innerHTML = teams.map(t => `<button class="chip ${state.teams.has(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');

  // bandeau direct
  const live = state.matches.filter(m => m.status === 'live');
  $('#live').className = 'live-banner' + (live.length ? ' on' : '');
  $('#live').innerHTML = live.length ? '<i></i>En direct : ' + live.map(m => `${esc(m.team)} ${m.sA ?? '–'}–${m.sB ?? '–'} ${esc(m.opponent)}`).join(' · ') : '';

  const vis = state.matches.filter(visible).sort((a, b) => (a.date || 9e15) - (b.date || 9e15));

  // regroupement par lieu
  const groups = new Map();
  for (const m of vis){ (groups.get(m.key) || groups.set(m.key, []).get(m.key)).push(m); }
  for (const loc of locs.values()) loc.ms = groups.get(loc.key) || [];

  // repères
  for (const [k, mk] of markers) if (!groups.has(k) || locs.get(k).lat == null){ map.removeLayer(mk); markers.delete(k); }
  for (const [k, ms] of groups){
    const loc = locs.get(k);
    if (loc.lat == null) continue;
    const cls = ms.some(m => m.status === 'live') ? 'live' : ms.some(m => m.status === 'todo') ? '' : 'done';
    let mk = markers.get(k);
    if (!mk){
      mk = L.marker([loc.lat, loc.lng], { icon: pinIcon(cls, ms.length) }).addTo(map);
      mk.bindPopup('', { autoPan: true, autoPanPadding: [20, 20], maxHeight: Math.min(300, Math.max(140, map.getSize().y - 130)) });
      mk.on('popupopen', async () => {
        state.sel = k; state.userMoved = true;
        mk.getPopup().setContent(popupHtml(loc));
        await ensureAnecdote(loc);
        if (mk.isPopupOpen()) mk.getPopup().setContent(popupHtml(loc));
        highlight();
      });
      mk.on('popupclose', () => { state.sel = null; highlight(); });
      markers.set(k, mk);
    } else {
      mk.setIcon(pinIcon(cls, ms.length));
      if (mk.isPopupOpen()) mk.getPopup().setContent(popupHtml(loc));
    }
  }

  // liste
  let html = '', lastDay = null;
  for (const m of vis){
    const day = m.date ? fmtDay(m.date) : 'Date à confirmer';
    if (day !== lastDay){ html += `<h3 class="day">${esc(day)}</h3>`; lastDay = day; }
    const loc = locs.get(m.key);
    const where = loc.lat != null ? esc(loc.name || loc.city || loc.ville) + (loc.approx ? ' (approx.)' : '')
      : loc.failed ? '<span class="warn">lieu introuvable</span>' : 'localisation…';
    html += `<article class="card ${state.sel === m.key ? 'sel' : ''}" data-k="${esc(m.key)}">
      <div class="when">${m.hasTime ? esc(fmtTime(m.date, true)) : '—'}</div>
      <div><div class="teams"><b>${esc(m.team)}</b><span class="vs">vs</span>${esc(m.opponent)}</div><div class="where ${loc.failed ? 'warn' : ''}">${where}</div></div>
      <div class="res">${resultHtml(m)}</div></article>`;
  }
  $('#list').innerHTML = html || '<div class="empty">Aucune rencontre pour ces filtres.</div>';

  if (state.needFit && markers.size){ state.needFit = false; fit(); }
}
function highlight(){ document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.k === state.sel)); }

/* ===== Interactions ===== */
$('#period').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.period = b.dataset.p; state.userMoved = false; state.needFit = true;
  document.querySelectorAll('#period button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('#teams').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const t = b.dataset.t; state.teams.has(t) ? state.teams.delete(t) : state.teams.add(t);
  state.userMoved = false; state.needFit = true; render();
});
$('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) focusLoc(c.dataset.k); });

/* ===== Actualisation ===== */
async function refresh(){
  const st = $('#status');
  try {
    state.matches = await loadSheet();
    const t = new Date().toLocaleTimeString('fr-FR');
    st.className = 'status';
    st.innerHTML = `<span>Mis à jour à ${t}</span><span>toutes les ${CONFIG.REFRESH_MS / 1000} s</span>`;
  } catch (e) {
    st.className = 'status err';
    st.innerHTML = '<span>Tableur injoignable — dernières données conservées</span>';
  }
  render();
  resolvePending();
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, CONFIG.REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
